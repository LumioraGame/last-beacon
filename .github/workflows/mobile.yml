name: Mobile readiness
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  game-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:native
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mobile
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mobile-browser-failures
          path: test-results/
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build:native && npm run mobile:version && npx cap sync android
      - run: ./gradlew --no-daemon :app:assembleDebug :app:bundleRelease
        working-directory: android
      - run: node scripts/verify-mobile-artifacts.mjs android
      - uses: actions/upload-artifact@v4
        with:
          name: android-candidates-unsigned-release
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - run: npm ci
      - run: npm run build:native && npm run mobile:version && npx cap sync ios
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath artifacts/ios-simulator CODE_SIGNING_ALLOWED=NO build
      - run: node scripts/verify-mobile-artifacts.mjs ios
        env:
          LAST_BEACON_IOS_APP: artifacts/ios-simulator/Build/Products/Debug-iphonesimulator/App.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-candidate
          path: artifacts/ios-simulator/Build/Products/Debug-iphonesimulator/App.app

name: Signed mobile candidates
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [android, ios, both]
        required: true
      build_number:
        description: Must exceed the last build number used in either store
        type: string
        required: true
      apple_team:
        description: Apple team ID (required for iOS)
        type: string
        required: false
permissions:
  contents: read
jobs:
  android:
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    env:
      MOBILE_BUILD_NUMBER: ${{ inputs.build_number }}
      LAST_BEACON_STORE_PASSWORD: ${{ secrets.LAST_BEACON_ANDROID_STORE_PASSWORD }}
      LAST_BEACON_KEY_ALIAS: ${{ secrets.LAST_BEACON_ANDROID_KEY_ALIAS }}
      LAST_BEACON_KEY_PASSWORD: ${{ secrets.LAST_BEACON_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test && npm run build:native && npm run mobile:version && npx cap sync android
      - name: Install upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.LAST_BEACON_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$LAST_BEACON_KEY_ALIAS" && test -n "$LAST_BEACON_STORE_PASSWORD" && test -n "$LAST_BEACON_KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/last-beacon-upload.jks"
          chmod 600 "$RUNNER_TEMP/last-beacon-upload.jks"
          printf 'LAST_BEACON_KEYSTORE=%s\n' "$RUNNER_TEMP/last-beacon-upload.jks" >> "$GITHUB_ENV"
      - run: ./gradlew --no-daemon :app:bundleRelease
        working-directory: android
      - run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
      - run: unzip -Z1 android/app/build/outputs/bundle/release/app-release.aab | rg '^META-INF/.*\.(RSA|DSA|EC)$'
      - run: sha256sum android/app/build/outputs/bundle/release/app-release.aab > artifacts/android-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: last-beacon-android-${{ inputs.build_number }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            artifacts/android-sha256.txt
      - if: always()
        run: rm -f "$RUNNER_TEMP/last-beacon-upload.jks"
  ios:
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-latest
    env:
      MOBILE_BUILD_NUMBER: ${{ inputs.build_number }}
      APPLE_TEAM: ${{ inputs.apple_team }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - run: npm ci
      - run: npm test && npm run build:native && npm run mobile:version && npx cap sync ios
      - name: Install distribution certificate and profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.LAST_BEACON_IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.LAST_BEACON_IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.LAST_BEACON_IOS_PROFILE_BASE64 }}
        run: |
          test -n "$APPLE_TEAM" && test -n "$CERTIFICATE_BASE64" && test -n "$PROFILE_BASE64"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/last-beacon.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/last-beacon.mobileprovision"
          chmod 600 "$RUNNER_TEMP/last-beacon.p12" "$RUNNER_TEMP/last-beacon.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/last-beacon.mobileprovision" > "$RUNNER_TEMP/last-beacon-profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/last-beacon-profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/last-beacon-profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/last-beacon.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/last-beacon.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/last-beacon.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/last-beacon.keychain-db"
          security import "$RUNNER_TEMP/last-beacon.p12" -P "$CERTIFICATE_PASSWORD" -A -k "$RUNNER_TEMP/last-beacon.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/last-beacon.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/last-beacon.keychain-db"
          printf 'PROFILE_NAME=%s\n' "$PROFILE_NAME" >> "$GITHUB_ENV"
      - name: Archive and export
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath artifacts/LastBeacon.xcarchive DEVELOPMENT_TEAM="$APPLE_TEAM" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" archive
          python3 - <<'PY'
          import os, plistlib
          with open('artifacts/ExportOptions.plist', 'wb') as stream:
              plistlib.dump({'method':'app-store-connect','signingStyle':'manual','teamID':os.environ['APPLE_TEAM'],'provisioningProfiles':{'ai.lumiora.lastbeacon':os.environ['PROFILE_NAME']}},stream)
          PY
          xcodebuild -exportArchive -archivePath artifacts/LastBeacon.xcarchive -exportPath artifacts/ios-export -exportOptionsPlist artifacts/ExportOptions.plist
          shasum -a 256 artifacts/ios-export/*.ipa > artifacts/ios-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: last-beacon-ios-${{ inputs.build_number }}
          path: |
            artifacts/ios-export/*.ipa
            artifacts/LastBeacon.xcarchive/dSYMs/
            artifacts/ios-sha256.txt
      - if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/last-beacon.keychain-db" || true
          rm -f "$RUNNER_TEMP/last-beacon.p12" "$RUNNER_TEMP/last-beacon.mobileprovision" "$RUNNER_TEMP/last-beacon-profile.plist"
